# officerwatch 的 Nginx 片段（示例：挂在 /officerwatch/ 子路径）
#
# __PORT__ 由 deploy/deploy.sh 渲染。手工使用：把这个文件放进
# /etc/nginx/snippets/，再在主 server 块里 include，然后 nginx -t && reload。
#
# 鉴权建议交给 Nginx（应用本身不处理口令）：
#   auth_basic "Restricted";
#   auth_basic_user_file /etc/nginx/.htpasswd;

location /officerwatch/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 手工导入 KillID 要等 zkb + ESI 两跳，超时给足
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # 页面很小，缓存交给应用自己（它发的是 no-cache）
    proxy_buffering off;
}

# 没有尾斜杠时补一个，否则相对路径的静态资源会 404
location = /officerwatch {
    return 301 /officerwatch/;
}
