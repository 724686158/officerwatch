# officerwatch 的 Nginx 片段（示例：挂在 /officerwatch/ 子路径）
#
# __PORT__ 由 deploy/deploy.sh 渲染。手工使用：把这个文件放进
# /etc/nginx/snippets/，再在主 server 块里 include，然后 nginx -t && reload。
#
# 鉴权有两种做法（二选一）：
#   1) 应用内登录：保留下面 location 里的 `auth_basic off;`，在 config.json 里配 auth.password；
#   2) 交给 Nginx：删掉 `auth_basic off;`，由外层 server 块统一弹 Basic Auth
#      （注意 Chrome 的弹框不支持粘贴口令）。

location /officerwatch/ {
    # 站点级的 Basic Auth 会在浏览器里弹原生对话框 —— Chrome 的弹框不允许粘贴口令。
    # 所以这个路径关掉 Basic Auth，改用应用自己的登录页 + 会话 cookie。
    auth_basic off;

    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 手工导入 KillID 要等 zkb + ESI 两跳，超时给足
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # 页面很小，缓存交给应用自己（它发的是 no-cache）
    proxy_buffering off;
}

# 没有尾斜杠时补一个，否则相对路径的静态资源会 404
location = /officerwatch {
    return 301 /officerwatch/;
}
