<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · 官员监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --fg:#161a22; --dim:#667085; --line:#e6e9ef;
    --accent:#2563eb; --bad:#dc2626; --bad-soft:#fef3f2;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1017; --card:#161b24; --fg:#e8eaf0; --dim:#98a2b3; --line:#242c3a; --accent:#6ea8fe; --bad:#f85149; --bad-soft:#2a1414; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg); padding: 24px;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 26px 24px 22px;
  }
  .mark { font-size: 26px; line-height: 1; }
  h1 { margin: 10px 0 2px; font-size: 19px; letter-spacing: -.01em; }
  .sub { margin: 0 0 20px; color: var(--dim); font-size: 13px; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  input[type="password"], input[type="text"] {
    width: 100%; height: 38px; padding: 0 12px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  button {
    width: 100%; height: 38px; margin-top: 16px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 10px;
  }
  button:hover { filter: brightness(1.05); }
  .err {
    margin: 0 0 14px; padding: 8px 12px; border-radius: 10px;
    background: var(--bad-soft); color: var(--bad); font-size: 13px;
  }
  .foot { margin: 16px 0 0; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <form class="card" method="post" action="{{.Base}}login">
    <div class="mark">🩸</div>
    <h1>官员监控</h1>
    <p class="sub">EVE Officer Watch · 输入口令进入</p>

    {{if .Error}}<p class="err">口令不对，再试一次（连续失败会被限流）。</p>{{end}}

    <label for="password">口令</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus required {{if .Off}}disabled{{end}}>
    <button type="submit" {{if .Off}}disabled{{end}}>进入</button>

    <p class="foot">浏览器会提示保存口令，下次自动填充；手机上也可以粘贴。</p>
  </form>
</body>
</html>
